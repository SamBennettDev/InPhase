name: Bug report
description: Report a reproducible problem
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Do not include keys, cookies or PINs."
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows build, GPU/driver, browser, network and codec/transport if known
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result and actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted diagnostics or screenshots
      description: Review logs and support bundles before sharing.
