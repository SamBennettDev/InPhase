name: Prepare release candidate
on:
  push:
    branches: [codex/release-polish]
    paths: [.github/workflows/candidate-bootstrap.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/codex/release-polish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/release-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh dependency lock and normalize source formatting
        run: |
          npm ci --prefix web --no-fund
          cargo fmt --all
          cd web
          npx --yes prettier@3.6.2 --write 'src/**/*.{ts,css}' 'tests/**/*.ts' scripts/test.mjs playwright.config.ts package.json
      - name: Save generated lock and formatting on candidate branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web crates
          if ! git diff --cached --quiet; then
            git commit -m "Refresh web dependency lock and format candidate sources"
            git push origin HEAD:codex/release-polish
          fi
      - run: npm test --prefix web
      - run: npm run build --prefix web
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - if: success() || failure()
        run: cargo test --locked --workspace
